[project]
name = "cardinal"
version = "0.1.0"
description = "Cardinal personal AI system: API, agents and brain router"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "icalendar>=7.3.0",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.4",
    "pypdf>=6.19.0",
    "pyyaml>=6.0",
    "rapidocr>=3.9.2",
    "recurring-ical-events>=3.8.2",
    "sqlmodel>=0.0.22",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# rapidocr asks for opencv-python, which needs desktop GL libraries the hub doesn't have.
# The headless build provides the same cv2 module without them.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
