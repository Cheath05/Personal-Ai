[project]
name = "cardinal"
version = "0.1.0"
description = "Cardinal personal AI system: API, agents and brain router"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "icalendar>=7.3.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
