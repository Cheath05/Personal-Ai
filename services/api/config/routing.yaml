# How each kind of job is routed.
#   policy: local             only local brains
#           claude            Claude first (falls back to local when over budget)
#           local_then_claude local, escalating to Claude if the result fails its checks
#   lane:   interactive | background  (which local brain order to use)
#   tier:   default | cheap | deep    (which Claude model, from brains.yaml)
#   effort: low | medium | high       (Claude effort; ignored for Haiku)

# When the month's spend passes the soft cap, only these jobs may still use Claude
# (plus anything you explicitly send with "Ask Claude instead").
essential_jobs: [weekly_rollup]

local_attempts: 2

jobs:
  chat:          { policy: local_then_claude, lane: interactive, tier: default, effort: medium, max_tokens: 900 }
  quick:         { policy: local,             lane: interactive, max_tokens: 400 }
  briefing:      { policy: local,             lane: background,  max_tokens: 1200 }
  briefing_now:  { policy: local,             lane: interactive, max_tokens: 1200 }   # "Write it now" on the Today view
  syllabus:      { policy: local,             lane: interactive, max_tokens: 1500 }   # dates from a syllabus, as JSON
  rollup_now:    { policy: local_then_claude, lane: interactive, tier: deep, effort: high, max_tokens: 2000 }  # "Write it now"
  sigma_patterns: { policy: local,            lane: background,  max_tokens: 600 }    # nightly Core Memory candidates
  tool_plan:     { policy: local,             lane: interactive, max_tokens: 400 }    # which tools a chat message needs, as JSON
  triage:        { policy: local,             lane: background,  max_tokens: 600 }
  checkin:       { policy: local,             lane: interactive, max_tokens: 800 }
  plan_week:     { policy: local_then_claude, lane: interactive, tier: default, effort: high, max_tokens: 2000 }
  weekly_rollup: { policy: claude,            lane: interactive, tier: deep,    effort: high, max_tokens: 3000 }  # G14 first when Claude isn't set up
  long_doc:      { policy: claude,            lane: background,  tier: cheap,   max_tokens: 2000 }
